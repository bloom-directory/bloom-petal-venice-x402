schema = "bloom.petal.build.v1"
name = "venice-x402"
routes = "route/files"
output = "petal/venice-x402"

[route_crate]
package = "venice-x402-route"
path = "route"
alias = "venice_x402_route"

# Pinned to the exact SDK rev the route crate is written against.
[sdk]
package = "bloom-petal-sdk"
git = "https://github.com/bloom-directory/petal"
rev = "b9fc22d6d8211bc41304b38b1ef8b5269c8035bd"

[dependencies]
# EIP-712 typed-data hashing for EIP-3009 payment authorization.
# Pinned: a patch release could change encoding and silently break signatures.
alloy-dyn-abi = "1.6"
alloy-primitives = "1.6"
base64 = "0.22"
hex = "0.4"
sha3 = "0.10"
