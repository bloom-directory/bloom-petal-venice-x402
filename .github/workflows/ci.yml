name: CI

on:
  push:
    branches: [main, "audit-fixes"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.98.1

      - name: Format check
        run: cargo fmt --check --manifest-path route/Cargo.toml

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --manifest-path route/Cargo.toml --locked -- -D warnings

      - name: Architecture check
        run: bash scripts/check-route-architecture.sh

      - name: Tests
        run: cargo test --manifest-path route/Cargo.toml --locked

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.255.0 --locked

      - name: Petal build (route-file compile gate)
        run: |
          bash scripts/build-petal.sh
          target/petal-tool/bin/petal check --root .
          target/petal-tool/bin/petal package --root . --out "$RUNNER_TEMP/venice-x402.petal.tar.gz"
